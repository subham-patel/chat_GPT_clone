<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="A thoughtful workspace for conversations with AI">
        <meta name="theme-color" content="#111318">
        <link rel="stylesheet" href="/assets/css/style.css">
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
        <link rel="manifest" href="/assets/img/site.webmanifest">
        <script src="/assets/js/icons.js"></script>
        <script src="/assets/js/chat.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/markdown-it@latest/dist/markdown-it.min.js"></script>
        <link rel="stylesheet" href="//cdn.jsdelivr.net/gh/highlightjs/cdn-release@latest/build/styles/base16/dracula.min.css">
        <script>
            const user_image = `<img src="/assets/img/user.png" alt="You">`;
            const gpt_image = `<img src="/assets/img/gpt.png" alt="Assistant">`;
        </script>
        <script src="/assets/js/highlight.min.js"></script>
        <script src="/assets/js/highlightjs-copy.min.js"></script>
        <script>window.conversation_id = `{{chat_id}}`</script>
        <title>Orbit · AI workspace</title>
    </head>
    <body>
        <div class="app-shell">
            <aside class="conversations" aria-label="Conversation sidebar">
                <div class="sidebar-brand">
                    <div class="brand-mark" aria-hidden="true"><i class="fa-regular fa-sparkles"></i></div>
                    <div class="brand-copy">
                        <strong>Orbit</strong>
                        <span>Your AI workspace</span>
                    </div>
                    <button class="mobile-close" type="button" aria-label="Close menu" onclick="toggle_sidebar(false)">
                        <i class="fa-regular fa-xmark"></i>
                    </button>
                </div>

                <div class="top">
                    <button class="new_convo" type="button" onclick="new_conversation()">
                        <i class="fa-regular fa-plus"></i>
                        <span>New conversation</span>
                        <kbd>⌘ K</kbd>
                    </button>
                    <label class="search-box" for="conversation-search">
                        <i class="fa-regular fa-magnifying-glass" aria-hidden="true"></i>
                        <input id="conversation-search" type="search" placeholder="Search conversations" autocomplete="off">
                        <kbd>/</kbd>
                    </label>
                    <div class="history-label"><span>Recent conversations</span><span class="history-count" id="history-count">0</span></div>
                    <div class="conversation-list" id="conversation-list"></div>
                    <div class="spinner"></div>
                </div>

                <div class="sidebar-bottom">
                    <div class="sidebar-actions">
                        <button type="button" onclick="export_conversation()" title="Export this conversation">
                            <i class="fa-regular fa-arrow-down-to-line"></i><span>Export chat</span>
                        </button>
                        <button type="button" onclick="delete_conversations()">
                            <i class="fa-regular fa-trash"></i><span>Clear all chats</span>
                        </button>
                    </div>
                    <div class="profile-card">
                        <img src="/assets/img/user.png" alt="" class="profile-avatar">
                        <div><strong>Personal workspace</strong><span>Preferences saved on this device</span></div>
                        <i class="fa-regular fa-circle-check profile-status" aria-hidden="true"></i>
                    </div>
                </div>
            </aside>

            <main class="conversation">
                <header class="chat-header">
                    <button class="mobile-sidebar" type="button" aria-label="Open menu" onclick="toggle_sidebar()">
                        <i class="fa-regular fa-bars"></i>
                    </button>
                    <div class="header-title">
                        <span class="eyebrow">AI ASSISTANT</span>
                        <h1>How can I help you today?</h1>
                    </div>
                    <div class="header-actions">
                        <span class="connection-indicator"><span></span> Ready</span>
                        <button class="icon-button" type="button" onclick="export_conversation()" aria-label="Export current conversation" title="Export conversation">
                            <i class="fa-regular fa-arrow-down-to-line"></i>
                        </button>
                        <label class="theme-picker" for="theme-select">
                            <i class="fa-regular fa-palette" aria-hidden="true"></i>
                            <select name="theme" id="theme-select" aria-label="Color theme">
                                <option value="dark">Dark</option>
                                <option value="light">Light</option>
                                <option value="blue">Ocean</option>
                                <option value="green">Forest</option>
                                <option value="pink">Rose</option>
                            </select>
                        </label>
                    </div>
                </header>

                <div class="conversation-viewport disable-scrollbars">
                    <div class="stop_generating stop_generating-hidden">
                        <button id="cancelButton" type="button">
                            <i class="fa-regular fa-stop"></i><span>Stop generating</span>
                        </button>
                    </div>
                    <div class="box" id="messages" aria-live="polite" aria-label="Conversation messages"></div>
                    <div class="suggestion-grid" id="suggestions" aria-label="Suggested prompts">
                        <button type="button" onclick="use_prompt('Help me brainstorm ideas for a new project')">
                            <span class="suggestion-icon"><i class="fa-regular fa-lightbulb"></i></span>
                            <span><strong>Brainstorm ideas</strong><small>Explore something new</small></span>
                            <i class="fa-regular fa-arrow-up-right suggestion-arrow"></i>
                        </button>
                        <button type="button" onclick="use_prompt('Explain a complex topic in simple terms')">
                            <span class="suggestion-icon"><i class="fa-regular fa-book-open"></i></span>
                            <span><strong>Learn something</strong><small>Make the complex clear</small></span>
                            <i class="fa-regular fa-arrow-up-right suggestion-arrow"></i>
                        </button>
                        <button type="button" onclick="use_prompt('Help me write a clear and engaging first draft')">
                            <span class="suggestion-icon"><i class="fa-regular fa-pen-to-square"></i></span>
                            <span><strong>Write a first draft</strong><small>Turn a thought into words</small></span>
                            <i class="fa-regular fa-arrow-up-right suggestion-arrow"></i>
                        </button>
                        <button type="button" onclick="use_prompt('Review this code and suggest improvements: ')">
                            <span class="suggestion-icon"><i class="fa-regular fa-code"></i></span>
                            <span><strong>Review some code</strong><small>Find a better approach</small></span>
                            <i class="fa-regular fa-arrow-up-right suggestion-arrow"></i>
                        </button>
                    </div>
                </div>

                <footer class="composer-area">
                    <div class="composer">
                        <textarea id="message-input" placeholder="Message Orbit…" aria-label="Write a message" rows="1" oninput="resizeTextarea(this)"></textarea>
                        <div class="composer-footer">
                            <div class="composer-options">
                                <label class="web-access" for="switch">
                                    <input type="checkbox" id="switch">
                                    <span class="switch-track" aria-hidden="true"></span>
                                    <span>Web search</span>
                                </label>
                                <label class="select-wrap" for="model">
                                    <i class="fa-regular fa-microchip" aria-hidden="true"></i>
                                    <select name="model" id="model" aria-label="Model">
                                        <option value="gpt-3.5-turbo">GPT-3.5</option>
                                        <option value="gpt-4">GPT-4</option>
                                        <option value="gpt-3.5-turbo-0301">GPT-3.5 (0301)</option>
                                        <option value="gpt-4-0314">GPT-4 (0314)</option>
                                        <option value="gpt-4-turbo">GPT-4 Turbo</option>
                                        <option value="gpt-4o" selected>GPT-4o</option>
                                    </select>
                                </label>
                                <label class="select-wrap advanced-option" for="jailbreak">
                                    <i class="fa-regular fa-sliders" aria-hidden="true"></i>
                                    <select name="jailbreak" id="jailbreak" aria-label="Assistant mode">
                                        <option value="default" selected>Default mode</option>
                                        <option value="gpt-math-1.0">Math mode</option>
                                        <option value="gpt-dude-1.0">Dude mode</option>
                                        <option value="gpt-dan-1.0">DAN 1.0</option>
                                        <option value="gpt-dan-2.0">DAN 2.0</option>
                                        <option value="gpt-dev-2.0">Dev mode</option>
                                        <option value="gpt-evil-1.0">Evil mode</option>
                                    </select>
                                </label>
                            </div>
                            <button id="send-button" type="button" aria-label="Send message" title="Send message">
                                <i class="fa-regular fa-arrow-up"></i>
                            </button>
                        </div>
                    </div>
                    <p class="composer-hint">Enter to send <span>·</span> Shift + Enter for a new line <span>·</span> AI can make mistakes</p>
                </footer>
            </main>
        </div>
    </body>
</html>
